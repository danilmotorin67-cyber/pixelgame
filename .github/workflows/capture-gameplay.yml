name: Capture gameplay screenshot

on:
  push:
    paths:
      - tests/screenshots/**
      - .github/workflows/capture-gameplay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.4.1
        run: |
          curl -fL --retry 3 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.4.1-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import project
        run: ./godot --headless --editor --path . --import --quit
      - name: Render cape
        run: |
          if ! command -v xvfb-run; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1920x1080x24' \
            ./godot --path . res://tests/screenshots/cape_capture.tscn
          python3 - <<'PY'
          from PIL import Image
          image = Image.open('capture.png').convert('RGB')
          assert image.getbbox(), 'Godot screenshot is empty'
          image.resize((1920, 1080), Image.Resampling.NEAREST).save('saltlight-cape.png')
          print('Captured game viewport:', image.size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: saltlight-cape
          path: saltlight-cape.png
